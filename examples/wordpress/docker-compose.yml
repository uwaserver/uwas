# UWAS + WordPress — Production-Ready Single VPS Stack
#
# Usage:
#   1. Clone this repository on your VPS
#   2. Create .env.local with your domain and passwords
#   3. Run: docker compose --env-file .env.local up -d --build
#   4. Open https://yourdomain.com to install WordPress
#   5. UWAS Dashboard: SSH tunnel to http://127.0.0.1:9443/_uwas/dashboard/
#
# Stack: UWAS (web server) + PHP-FPM 8.3 + MariaDB 11 + Redis (optional)
# Features: Auto HTTPS, caching, .htaccess support, admin dashboard

services:
  # ─── UWAS Web Server ───────────────────────────────────────────
  uwas:
    image: uwas:local
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${ADMIN_PORT:-9443}:9443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env.local}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?set ADMIN_EMAIL in .env.local}"
      UWAS_ADMIN_KEY: "${UWAS_ADMIN_KEY:?set UWAS_ADMIN_KEY in .env.local}"
      SSL_MODE: "${SSL_MODE:-auto}"
    volumes:
      - ./config/uwas.yaml:/etc/uwas/uwas.yaml:ro
      - wordpress:/var/www/html
      - certs:/var/lib/uwas/certs
      - cache:/var/cache/uwas
      - logs:/var/log/uwas
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # ─── WordPress PHP-FPM ─────────────────────────────────────────
  php:
    image: uwas-wordpress-php:7.0.1
    build:
      context: ../..
      dockerfile: examples/wordpress/php.Dockerfile
    volumes:
      - wordpress:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env.local}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MariaDB ───────────────────────────────────────────────────
  db:
    image: uwas-mariadb:11.8.8
    build:
      context: ../..
      dockerfile: docker/mariadb.Dockerfile
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.local}"
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env.local}"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── WordPress CLI (opt-in tools profile) ──────────────────────
  wp-cli:
    image: uwas-wordpress-cli:2.12.0
    build:
      context: ../..
      dockerfile: examples/wordpress/wp-cli.Dockerfile
    profiles: [tools]
    volumes:
      - wordpress:/var/www/html
      - uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env.local}"
    entrypoint: [wp]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  wordpress:
    driver: local
  uploads:
    driver: local
  db_data:
    driver: local
  certs:
    driver: local
  cache:
    driver: local
  logs:
    driver: local

networks:
  frontend:
  backend:
