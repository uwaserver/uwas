name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo. Grant write per-job if ever
# required, never at the top level.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pin tool versions (not @latest) for reproducible CI; Dependabot
      # (.github/dependabot.yml) proposes bumps.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        run: actionlint

      - name: Audit workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" \
            ghcr.io/woodruffw/zizmor@sha256:3d53be4e0f48952112aa4ca00f45e724b70598082e7202c5c412a6779ca38134 /src

      - name: Lint Dockerfile
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            hadolint/hadolint@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2 \
            hadolint /src/Dockerfile /src/docker/php.Dockerfile \
            /src/docker/mariadb.Dockerfile \
            /src/examples/wordpress/php.Dockerfile \
            /src/examples/wordpress/wp-cli.Dockerfile

      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            /mnt/install.sh /mnt/update.sh /mnt/scripts/install.sh \
            /mnt/scripts/uninstall.sh /mnt/docker/entrypoint.sh \
            /mnt/test/docker/test.sh /mnt/test/docker/wordpress.sh \
            /mnt/examples/wordpress/setup.sh

      - name: Lint (go vet + staticcheck)
        run: |
          mapfile -t GO_PACKAGES < <(go list ./... | grep -v '/node_modules/')
          go vet "${GO_PACKAGES[@]}"
          staticcheck "${GO_PACKAGES[@]}"

      - name: Vulnerability scan
        run: |
          mapfile -t GO_PACKAGES < <(go list ./... | grep -v '/node_modules/')
          govulncheck "${GO_PACKAGES[@]}"

      - name: Test
        run: |
          mapfile -t GO_PACKAGES < <(go list ./... | grep -v '/node_modules/')
          go test -v -count=1 -timeout 600s "${GO_PACKAGES[@]}" 2>&1 | tee /tmp/test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-output
          path: /tmp/test-output.log

  race:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start patched MariaDB
        run: |
          docker build -f docker/mariadb.Dockerfile -t uwas-mariadb:ci .
          docker run --detach --rm --name uwas-race-mysql \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_ROOT_HOST=% \
            -p 127.0.0.1:3306:3306 uwas-mariadb:ci
          for _ in {1..60}; do
            if docker exec uwas-race-mysql \
              healthcheck.sh --connect --innodb_initialized; then
              exit 0
            fi
            sleep 2
          done
          docker logs uwas-race-mysql
          exit 1

      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Race detector
        run: |
          mapfile -t GO_PACKAGES < <(go list ./... | grep -v '/node_modules/')
          go test -race -count=1 -timeout 900s "${GO_PACKAGES[@]}"
        env:
          UWAS_DB_HOST: "127.0.0.1"
          UWAS_DB_PORT: "3306"
          UWAS_DB_USER: "root"
          UWAS_DB_PASSWORD: "root"

      - name: Stop MariaDB
        if: always()
        run: docker stop uwas-race-mysql 2>/dev/null || true

  docker-integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Docker Compose integration suite
        run: make -s -C test/docker test

      - name: Run WordPress example integration suite
        run: make -s -C test/docker wordpress

      - name: Scan runtime images
        run: |
          mkdir -p /tmp/trivy-cache
          for image in docker-uwas uwas-php:test uwas-mariadb:test \
            uwas-wordpress-php:7.0.1 uwas-wordpress-cli:2.12.0; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache \
              -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
              aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --exit-code 1 --severity HIGH,CRITICAL \
              --ignorefile /.trivyignore.yaml \
              --scanners vuln,secret "$image"
          done

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web/dashboard
        run: npm ci

      - name: Type check
        working-directory: web/dashboard
        run: npx tsc -b

      - name: Audit dependencies
        working-directory: web/dashboard
        run: npm audit --audit-level=moderate

      - name: Lint
        working-directory: web/dashboard
        run: npm run lint

      - name: Build
        working-directory: web/dashboard
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Audit dependencies
        working-directory: docs/site
        run: npm audit --audit-level=moderate

      - name: Lint
        working-directory: docs/site
        run: npm run lint

      - name: Build
        working-directory: docs/site
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, dashboard]
    # Uses the system-installed Google Chrome (channel: 'chrome') instead of
    # downloading from Playwright CDN. Reliable across all GitHub Actions
    # runners since ubuntu-latest ships Chrome pre-installed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web/dashboard
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build dashboard (go:embed)
        working-directory: web/dashboard
        run: npm run build

      - name: Build UWAS binary
        run: CGO_ENABLED=0 go build -o /tmp/uwas ./cmd/uwas

      - name: Run E2E tests
        working-directory: web/dashboard
        run: node_modules/.bin/playwright test
        env:
          CI: "true"
          UWAS_BIN: "/tmp/uwas"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/dashboard/playwright-report/
