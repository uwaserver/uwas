name: Deploy Docs

# Docs are deployed by hand (`gh workflow run docs.yml`) or on a release
# tag (v*), not on every push to main. See CONTRIBUTING.md -> "CI".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Install and build
        working-directory: docs/site
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run build

      - name: Package pages artifact
        run: |
          tar --dereference --hard-dereference -cvf github-pages.tar -C docs/site/dist .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-pages
          path: github-pages.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
