services:
  uwas:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./uwas-test.yaml:/etc/uwas/uwas.yaml:ro
      - ./www:/var/www:ro
      - uwas-cache:/var/cache/uwas
      - uwas-certs:/var/lib/uwas/certs
    depends_on:
      - php
      - db
    networks:
      testnet:
        aliases:
          - static.test
          - php.test
          - proxy.test
          - redirect.test
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9443/api/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  php:
    image: uwas-php:test
    build:
      context: ../..
      dockerfile: docker/php.Dockerfile
    working_dir: /var/www/php
    volumes:
      - ./www:/var/www:ro
    networks:
      - testnet

  db:
    image: uwas-mariadb:test
    build:
      context: ../..
      dockerfile: docker/mariadb.Dockerfile
    environment:
      MARIADB_ROOT_PASSWORD: test_root_pass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: test_wp_pass
    tmpfs:
      - /var/lib/mysql
    networks:
      - testnet

  upstream:
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    command:
      - python3
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        import json

        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok", "backend": "upstream"}).encode())

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 8080), H).serve_forever()
    networks:
      - testnet

  tester:
    image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
    depends_on:
      uwas:
        condition: service_healthy
    volumes:
      - ./test.sh:/test.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache curl jq bash > /dev/null 2>&1 && bash /test.sh"]
    environment:
      UWAS_HOST: uwas
      UWAS_PORT: "80"
      ADMIN_HOST: uwas
      ADMIN_PORT: "9443"
      API_KEY: "test-key-12345"
    networks:
      - testnet

networks:
  testnet:
    driver: bridge

volumes:
  uwas-cache:
  uwas-certs:
