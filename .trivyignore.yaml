    # openssl: QUIC sunucusunda sınırsız bellek büyümesiyle hizmet reddi.
    # libcrypto3 / libssl3 3.5.7-r0, düzeltme 3.5.8-r0.
    #
    # 27.08.2026 itibarıyla 3.5.8-r0 Alpine'ın HİÇBİR dalında yok — 3.24 de
